# ============================================================
# MediFlow — Test Configuration (H2 in PostgreSQL Mode)
# ============================================================

# H2 DataSource (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Connection Pool sized for 25+ concurrent test threads
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=25
spring.datasource.hikari.connection-timeout=10000

# JPA — no DDL (Flyway handles schema creation)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway — apply both V1 (schema) and V2 (seed) to H2
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# JWT (test secret — 32+ chars required for HS256)
app.jwt.secret=mediflow-test-secret-key-32-chars!!
app.jwt.expiration-ms=86400000

# WebSocket
app.websocket.cors.allowed-origins=http://localhost:5173

# Disable virtual threads in test for determinism
spring.threads.virtual.enabled=false

# Logging
logging.level.com.mediflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
