# ============================================================
# MediFlow — Application Configuration
# Connects to Supabase PostgreSQL when SUPABASE_DB_URL is provided,
# otherwise falls back to in-memory PostgreSQL-compatible mode.
# ============================================================

# DataSource
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:mediflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Flyway (auto-creates and seeds the app schema)
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Virtual Threads (Project Loom — Java 21+)
spring.threads.virtual.enabled=true

# JWT (defaults to a safe 32-byte secret for dev; override in production via JWT_SECRET)
app.jwt.secret=${JWT_SECRET:mediflow-secure-clinical-jwt-secret-key-32-chars!}
app.jwt.expiration-ms=86400000

# WebSocket & HTTP CORS — comma-separated list; override via ALLOWED_ORIGINS env var on Render
app.websocket.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://mediflow2.vercel.app}

# Server
server.port=${PORT:8080}

# Actuator (health check endpoint for Render Docker health probe)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.mediflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
